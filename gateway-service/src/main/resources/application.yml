server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
      - id: company-service
        uri: http://localhost:8081
        predicates:
          - Path=/WorkVisionWeb/company/**
      - id: laboratory-qc-service
        uri: http://localhost:8082
        predicates:
          - Path=/WorkVisionWeb/laboratory/qc/**
      - id: equipment-service
        uri: http://localhost:8083
        predicates:
          - Path=/WorkVisionWeb/equipment/**
      - id: library-service
        uri: http://localhost:8084
        predicates:
          - Path=/WorkVisionWeb/library/**
      - id: measurement-qc-service
        uri: http://localhost:8085
        predicates:
          - Path=/WorkVisionWeb/measurement/qc/**
      - id: document-qc-service
        uri: http://localhost:8086
        predicates:
          - Path=/WorkVisionWeb/document/qc/**
      - id: document-template-service
        uri: http://localhost:8087
        predicates:
          - Path=/WorkVisionWeb/document/template/**