springdoc:
  swagger-ui:
    path: /swagger-ui-library-service.html

server:
  port: 8084

spring:
  application:
    name: library-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    hikari:
      username: postgres
      password: mywords

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-service:8761/eureka
    healthcheck:
      enabled: true
  instance:
    preferIpAddress: true