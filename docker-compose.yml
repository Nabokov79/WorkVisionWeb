  equipment-service:
    build: equipment-service
    container_name: equipment-service
    ports:
      - "8083:8083"
    networks:
      - backend
    depends_on:
      equipment-db:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://equipment-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mywords

  equipment-db:
    image: postgres:14-alpine
    container_name: equipment-db
    ports:
      - "6544:5434"
    networks:
      - backend
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mywords
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U habrpguser -d habrdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  library-service:
    build: library-service
    container_name: library-service
    ports:
      - "8084:8084"
    networks:
      - backend
    depends_on:
      library-db:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://library-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mywords
      - SERVER_PORT=8084

  library-db:
    image: postgres:14-alpine
    container_name: library-db
    ports:
      - "6545:5435"
    networks:
      - backend
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mywords
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U habrpguser -d habrdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  measurement-qc-service:
    build: measurement-qc-service
    container_name: measurement-qc-service
    ports:
      - "8085:8085"
    networks:
      - backend
    depends_on:
      measurement-qc-db:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      library-service:
        condition: service_started
      equipment-service:
        condition: service_started
    environment:
      - LIBRARY-SERVICE_URL=http://library-service:8084
      - EQUIPMENT-SERVICE_URL=http://equipment-service:8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://measurement-qc-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mywords

  measurement-qc-db:
    image: postgres:14-alpine
    container_name: measurement-qc-db
    ports:
      - "6546:5436"
    networks:
      - backend
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mywords
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U habrpguser -d habrdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

