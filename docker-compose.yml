        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://document-template-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mywords

  document-template-db:
    image: postgres:14-alpine
    container_name: document-template-db
