  library-service:
    build: library-service
    container_name: library-service
    ports:
      - "8084:8084"
    networks:
      - backend
    depends_on:
      library-db:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://library-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mywords

  library-db:
    image: postgres:14-alpine
    container_name: library-db
    ports:
      - "6548:5432"
    networks:
      - backend
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mywords
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U habrpguser -d habrdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway-service:
    build: gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      eureka-service:
        condition: service_healthy

networks:
  backend:
    driver: bridge

