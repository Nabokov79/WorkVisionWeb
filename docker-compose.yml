      - SPRING_DATASOURCE_URL=jdbc:postgresql://measurement-qc-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=mywords

  measurement-qc-db:
    image: postgres:14-alpine
    container_name: measurement-qc-db
