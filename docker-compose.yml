version: '3.9'
services:
  eureka-service:
    build: eureka-service
    container_name: eureka-service
    ports:
      - "8761:8761"
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "http://eureka-service:8761/eureka" ]
      interval: 10s
      retries: 5
      timeout: 10s

